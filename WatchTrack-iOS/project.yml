name: WatchTrack

options:
  bundleIdPrefix: com.watchtrack
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WatchTrack:
    type: application
    platform: iOS
    sources:
      - path: WatchTrack
        excludes:
          - Resources/www
    resources:
      - path: WatchTrack/Resources/www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watchtrack.app.ios
        INFOPLIST_FILE: WatchTrack/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: minimal
